name: Build APK Layanan Sistem

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Kode
        uses: actions/checkout@v4

      - name: Konfigurasi JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Konfigurasi Android SDK
        uses: android-actions/setup-android@v3

      - name: Konfigurasi Gradle 8.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Kompilasi APK (assembleDebug)
        run: gradle assembleDebug --stacktrace

      - name: Unggah File APK ke GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: LayananSistem-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
